  <line x1="2.9" y1="2.9" x2="4.3" y2="4.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11.7" y1="11.7" x2="13.1" y2="13.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2.9" y1="13.1" x2="4.3" y2="11.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11.7" y1="4.3" x2="13.1" y2="2.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>`;
const MAP_MOON_ICON = `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
  <path d="M 12 8.5 A 5 5 0 1 1 7 3.5 A 4 4 0 0 0 12 8.5 Z" fill="currentColor"/>
</svg>`;

// v2.86.3: localStorage key for persisting the user's map theme
// choice across navigations. Set once, sticks across page loads
// and aircraft detail page navigations. Uses dotted-namespace
// convention so future Aerodrome browser-side preferences don't
// collide with this one.
const MAP_THEME_KEY = 'aerodrome.map_theme';

function getStoredMapTheme() {
    // Defensive: localStorage can throw in some browser configurations
    // (private mode, disabled storage, etc). Fall back to 'dark'
    // (the chosen default) on any read failure.
    try {
        const v = localStorage.getItem(MAP_THEME_KEY);
        if (v === 'light' || v === 'dark') return v;
    } catch (e) { /* ignore */ }
    return 'dark';
}
function setStoredMapTheme(theme) {
    try {
        localStorage.setItem(MAP_THEME_KEY, theme);
    } catch (e) { /* ignore — storage may be unavailable */ }
}

// v2.86.1: toggle the map between default and expanded heights.
// CSS handles the actual height transition (220ms ease); we just
// flip the .expanded class on #positionMap, swap the button's icon
// + title to match the new state, and tell Leaflet to recompute
// its viewport after the transition completes. Without the
// invalidateSize() call, tiles outside the original 420px viewport
// don't load until the user pans — looks broken.
function toggleMapSize() {
    const mapEl = document.getElementById('positionMap');
    const btn = document.querySelector('.map-expand-btn');
    if (!mapEl || !btn) return;
    const isExpanded = mapEl.classList.toggle('expanded');
    btn.innerHTML = isExpanded ? MAP_COLLAPSE_ICON : MAP_EXPAND_ICON;
    btn.title = isExpanded ? 'Collapse map' : 'Expand map';
    btn.setAttribute('aria-label', btn.title);
    // Wait for the CSS height transition (200ms) to finish before
    // telling Leaflet the container size changed. Calling it sooner
    // means Leaflet computes tile positions for an intermediate
    // height, then the container keeps growing past where Leaflet
    // thinks the edge is — half-loaded tiles until pan/zoom.
    setTimeout(() => {
        if (_posMapState.map) _posMapState.map.invalidateSize();
    }, 220);
}

// v2.86.3: toggle the map between dark and light tile providers.
// Both tile layers were pre-created at map-init time and stored in
// _posMapState; this function just removes one and adds the other.
// State is persisted to localStorage so the choice sticks across
// navigations (a single-page app refresh, navigating to a different
// aircraft's detail page, etc).
function toggleMapTheme() {
    if (!_posMapState.map) return;
    const goingDark = _posMapState.currentTheme === 'light';
    if (goingDark) {
        _posMapState.lightTiles.removeFrom(_posMapState.map);
        _posMapState.darkTiles.addTo(_posMapState.map);
    } else {
        _posMapState.darkTiles.removeFrom(_posMapState.map);
        _posMapState.lightTiles.addTo(_posMapState.map);
    }
    _posMapState.currentTheme = goingDark ? 'dark' : 'light';
    setStoredMapTheme(_posMapState.currentTheme);

    // Update the theme button's icon + label. Querying by class is
    // sufficient since there's only one .map-theme-btn per page.
    const btn = document.querySelector('.map-theme-btn');
    if (btn) {
        const isDark = _posMapState.currentTheme === 'dark';
        btn.innerHTML = isDark ? MAP_SUN_ICON : MAP_MOON_ICON;
        btn.title = isDark ? 'Switch to light map' : 'Switch to dark map';
        btn.setAttribute('aria-label', btn.title);
    }
}

let _posMapState = {
    map: null,           // Leaflet Map instance once initialized
    tracksLayer: null,   // v3.4.31: L.layerGroup of polyline segments + orphan dots, replaced per fetch
    receiverMarker: null,
    canvasRenderer: null,
    icao: null,
    currentWindow: '24h',
    // v2.86.3: theme-related state. We keep BOTH tile layers as
    // Leaflet objects from map-init time, then add/remove them on
    // toggle rather than constructing them on demand. Two reasons:
    // (1) creating a TileLayer triggers tile fetches; pre-creating
    // both at init time means the first toggle is instant for tiles
    // already in cache. (2) keeping the layer references lets us
    // call removeLayer cleanly without identity-tracking.
    lightTiles: null,    // L.tileLayer pointing at OSM standard
    darkTiles: null,     // L.tileLayer pointing at Carto Dark Matter
    currentTheme: 'dark',
};

// v3.4.31: altToColor() function was removed. It used to do alt→color
// directly for the per-position dot renderer. The new line renderer
// uses a BIN_COLORS array inside loadPositions() with hysteresis-aware
// binning, so the single mapping function is no longer needed. If any
// future caller needs alt→color independently, build it from
// BIN_THRESHOLDS + BIN_COLORS in the rendering block below.

function initPositionMap(icao) {
    const block = document.getElementById('positionMapBlock');
    if (!block) return;
    _posMapState.icao = icao;

    // Render controls + map skeleton up front. Even before the first
    // fetch returns, the user sees the buttons and the empty map
    // surface — avoids a blank-rectangle flash. The "loading…" tag
    // in .meta tells them data is on the way.
    block.innerHTML = `
        <div class="map-controls" id="mapControls">
            <span class="lbl">Window:</span>
            <button type="button" class="win-btn active" data-win="24h">24h</button>
            <button type="button" class="win-btn" data-win="7d">7d</button>
            <button type="button" class="win-btn" data-win="30d">30d</button>
            <button type="button" class="win-btn" data-win="all">All</button>
            <span class="meta" id="mapMeta">loading…</span>
        </div>
        <div id="positionMap"></div>
        <div class="map-altitude-legend">
            <span>Altitude:</span>
            <span>0 ft</span>
            <div class="gradient"></div>
            <span>45,000+ ft</span>
        </div>
    `;

    // Wire button clicks. Each button refetches positions for its
    // window and replaces the dots layer. Active-state class is
    // toggled in lockstep so the user sees which window is current.
    block.querySelectorAll('.win-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const win = btn.getAttribute('data-win');
            if (win === _posMapState.currentWindow) return;
            block.querySelectorAll('.win-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            _posMapState.currentWindow = win;
            loadPositions(win);
        });
    });

    // Initial fetch. The default-active button is 24h, so this matches.
    loadPositions('24h');
}

async function loadPositions(window) {
    const meta = document.getElementById('mapMeta');
    if (meta) {
        meta.textContent = 'loading…';
        meta.classList.remove('truncated');
    }
    let data;
    try {
        const r = await fetch(
            `/api/aircraft/${encodeURIComponent(_posMapState.icao)}` +
            `/positions?window=${encodeURIComponent(window)}`
        );
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        data = await r.json();
    } catch (e) {
        if (meta) meta.textContent = `error: ${e.message || e}`;
        return;
    }

    // No receiver lat/lon configured → render the config-nudge
    // placeholder. We swap the entire #positionMapBlock contents
    // because the controls + map UI is meaningless without a map.
    // This branch only fires the first time loadPositions runs (the
    // server's receiver field is config-driven, not request-scoped),
    // so we don't worry about toggling between nudge and map.
    if (!data.receiver) {
        const block = document.getElementById('positionMapBlock');
        if (block) {
            block.innerHTML = `
                <div class="map-no-receiver">
                    <div><strong>Map view needs receiver coordinates.</strong></div>
                    <div style="margin-top:6px">
                        Set <code>receiver.latitude</code> and <code>receiver.longitude</code> on the
                        <a href="/configuration#receiver">Configuration → Receiver</a> tab to see this aircraft's
                        position history plotted on a map.
                    </div>
                </div>
            `;
        }
        return;
    }

    // Initialize the map on first run; subsequent loadPositions calls
    // reuse the existing map instance and just swap the dots layer.
    if (!_posMapState.map) {
        // Canvas renderer. Default Leaflet uses SVG which gets sluggish
        // past ~1000 markers; canvas scales to 10k+ comfortably.
        _posMapState.canvasRenderer = L.canvas({ padding: 0.5 });

        _posMapState.map = L.map('positionMap', {
            preferCanvas: true,
            zoomControl: true,
            attributionControl: true,
        }).setView([data.receiver.lat, data.receiver.lon], 9);

        // v2.86.3: pre-create both tile layers and pick which to add
        // based on the persisted theme preference. Carto Dark Matter
        // is a free, no-API-key tile set with cartography that fits
        // Aerodrome's dark theme; OSM standard is the original light
        // tiles from v2.86.0. Default theme is 'dark' (chosen because
        // the rest of the app is dark-themed and the light tiles
        // looked jarring in context).
        _posMapState.lightTiles = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 18,
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            }
        );
        _posMapState.darkTiles = L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
            }
        );
        _posMapState.currentTheme = getStoredMapTheme();
        const initialTiles = (_posMapState.currentTheme === 'light')
            ? _posMapState.lightTiles
            : _posMapState.darkTiles;
        initialTiles.addTo(_posMapState.map);

        // Receiver marker: standard Leaflet default-icon pin so it's
        // visually distinct from the colored sighting dots. Uses the
        // bundled marker images from /static/leaflet/images.
        const receiverIcon = L.icon({
            iconUrl: '/static/leaflet/images/marker-icon.png',
            iconRetinaUrl: '/static/leaflet/images/marker-icon-2x.png',
            shadowUrl: '/static/leaflet/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41],
        });
        _posMapState.receiverMarker = L.marker(
            [data.receiver.lat, data.receiver.lon],
            { icon: receiverIcon, title: 'Receiver location' }
        ).addTo(_posMapState.map).bindPopup('Your receiver');

        // v2.86.1: expand/collapse control. Toggles #positionMap's
        // height between the default 420px and an expanded 840px so
        // users who want to study the data have more vertical real
        // estate without it dominating the page by default. Lives in
        // Leaflet's bottomleft control container — clean placement,
        // no collision with OSM attribution (bottom-right) or zoom
        // controls (top-left).
        const ExpandControl = L.Control.extend({
            options: { position: 'bottomleft' },
            onAdd: function(_map) {
                const btn = L.DomUtil.create('button', 'map-expand-btn');
                btn.type = 'button';
                btn.title = 'Expand map';
                btn.setAttribute('aria-label', 'Expand map');
                btn.innerHTML = MAP_EXPAND_ICON;
                // Stop clicks from propagating to the map below — without
                // this, clicking the button also pans/zooms the map.
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', toggleMapSize);
                return btn;
            }
        });
        _posMapState.map.addControl(new ExpandControl());

        // v2.86.3: theme toggle control. Same Leaflet-control-extension
        // pattern as ExpandControl above, anchored topright (only empty
        // corner — zoom controls top-left, expand bottom-left, OSM
        // attribution bottom-right). Icon shows the destination state:
        // when dark mode is active, button shows sun (click → light);
        // when light mode is active, button shows moon (click → dark).
        const ThemeControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function(_map) {
                const btn = L.DomUtil.create('button', 'map-expand-btn map-theme-btn');
                btn.type = 'button';
                // Initial icon + label match initial state. Toggle handler
                // updates these in lockstep.
                const isDark = _posMapState.currentTheme === 'dark';
                btn.innerHTML = isDark ? MAP_SUN_ICON : MAP_MOON_ICON;
                btn.title = isDark ? 'Switch to light map' : 'Switch to dark map';
                btn.setAttribute('aria-label', btn.title);
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', toggleMapTheme);
                return btn;
            }
        });
        _posMapState.map.addControl(new ThemeControl());
    }

    // v3.4.31: replaced per-point dots with multi-color polyline segments.
    // Each segment is colored by its ending point's altitude bin (sharp
    // transition at the upper endpoint when the aircraft crosses a
    // band). The line BREAKS at any time gap exceeding GAP_THRESHOLD_SEC
    // — drawing a connecting line across a coverage gap would imply a
    // path that didn't actually happen. 500 ft hysteresis at each bin
    // boundary prevents flicker when altitude wobbles within ±250 ft of
    // a threshold during steady cruise. Single-point orphans (no
    // neighbor inside the gap threshold on either side) fall back to a
    // small dot at their bin color so isolated points remain visible.
    //
    // History note: pre-v3.4.31 this block rendered each position as a
    // separate L.circleMarker on the canvas. That worked but didn't
    // convey the path SHAPE — the eye had to assemble the track from a
    // cloud of dots. The line rendering shows the shape directly while
    // keeping per-point altitude information via segment color.

    const GAP_THRESHOLD_SEC = 120;
    const HYSTERESIS_FT = 500;

    // Bin thresholds and colors. Six bins, five thresholds between
    // them. These define both the visual encoding here AND the gradient
    // shown in the .map-altitude-legend strip in the page CSS — any
    // change here must be mirrored in that gradient's stops (and vice
    // versa) or the legend will drift from the colors on the map.
    const BIN_THRESHOLDS = [1000, 10000, 25000, 35000, 45000];
    const BIN_COLORS = ['#22c55e', '#84cc16', '#eab308', '#f97316', '#ef4444', '#dc2626'];

    function _rawBin(alt) {
        if (alt == null) return 0;
        for (let i = 0; i < BIN_THRESHOLDS.length; i++) {
            if (alt < BIN_THRESHOLDS[i]) return i;
        }
        return BIN_THRESHOLDS.length;
    }

    function _binWithHysteresis(alt, prevBin) {
        const raw = _rawBin(alt);
        if (prevBin === undefined || raw === prevBin) return raw;
        const buffer = HYSTERESIS_FT / 2;
        if (raw > prevBin) {
            // Going up: only transition once alt >= boundary + buffer.
            const boundary = BIN_THRESHOLDS[prevBin];
            return alt >= boundary + buffer ? raw : prevBin;
        } else {
            // Going down: only transition once alt <= boundary - buffer.
            const boundary = BIN_THRESHOLDS[raw];
            return alt <= boundary - buffer ? raw : prevBin;
        }
    }

    if (_posMapState.tracksLayer) {
        _posMapState.tracksLayer.removeFrom(_posMapState.map);
        _posMapState.tracksLayer = null;
    }

    // Pre-compute the hysteresis-adjusted bin for each position.
    const binned = [];
    let prevBin;
    for (const p of data.positions) {
        const [seenAt, lat, lon, alt] = p;
        const bin = _binWithHysteresis(alt, prevBin);
        binned.push({ seenAt, lat, lon, alt, bin });
        prevBin = bin;
    }

    // Walk consecutive pairs. Build polylines: each is a run of
    // same-colored consecutive segments. Time-gap breaks close the
    // current polyline; bin changes start a new polyline that shares
    // its starting vertex with the previous one (so the visual line
    // stays continuous across the color transition).
    const polylines = [];
    let cur = null;
    for (let i = 1; i < binned.length; i++) {
        const prev = binned[i - 1];
        const here = binned[i];
        const timeGap = here.seenAt - prev.seenAt;
        if (timeGap > GAP_THRESHOLD_SEC) {
            cur = null;
            continue;
        }
        const color = BIN_COLORS[here.bin];
        if (cur === null || cur.color !== color) {
            cur = { color, points: [[prev.lat, prev.lon], [here.lat, here.lon]] };
            polylines.push(cur);
        } else {
            cur.points.push([here.lat, here.lon]);
        }
    }

    // Detect orphan points — no neighbor within the gap threshold on
    // either side. Fall back to a small dot so isolated points stay
    // visible. Without this, a single position surrounded by long
    // gaps would render as nothing.
    const orphanDots = [];
    for (let i = 0; i < binned.length; i++) {
        const p = binned[i];
        const prev = i > 0 ? binned[i - 1] : null;
        const next = i < binned.length - 1 ? binned[i + 1] : null;
        const prevConnected = prev && (p.seenAt - prev.seenAt) <= GAP_THRESHOLD_SEC;
        const nextConnected = next && (next.seenAt - p.seenAt) <= GAP_THRESHOLD_SEC;
        if (!prevConnected && !nextConnected) {
            orphanDots.push(L.circleMarker([p.lat, p.lon], {
                renderer: _posMapState.canvasRenderer,
                radius: 2.5,
                fillColor: BIN_COLORS[p.bin],
                fillOpacity: 1.0,
                stroke: false,
            }));
        }
    }

    const layers = [];
    for (const poly of polylines) {
        layers.push(L.polyline(poly.points, {
            renderer: _posMapState.canvasRenderer,
            color: poly.color,
            weight: 2.5,
            opacity: 1.0,
            lineCap: 'round',
            lineJoin: 'round',
        }));
    }
    layers.push(...orphanDots);
    _posMapState.tracksLayer = L.layerGroup(layers).addTo(_posMapState.map);

    // Auto-fit bounds: include receiver + all dots. If there are no
    // dots in this window, just keep the existing view (don't fitBounds
    // to a single-point marker — Leaflet zooms to max which is jarring).
    if (data.positions.length > 0) {
        const bounds = L.latLngBounds(
            data.positions.map(p => [p[1], p[2]])
        );
        bounds.extend([data.receiver.lat, data.receiver.lon]);
        _posMapState.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
    } else {
        // No positions in this window — re-center on the receiver
        // since the previous window's bounds are no longer relevant.
        _posMapState.map.setView([data.receiver.lat, data.receiver.lon], 9);
    }

    // Update the meta line with count + truncation notice.
    if (meta) {
        if (data.count === 0) {
            meta.textContent = 'no positions in this window';
        } else {
            const label = data.count === 1 ? 'position' : 'positions';
            meta.textContent = `${data.count.toLocaleString()} ${label}`;
            if (data.truncated) {
                meta.textContent += ' (sampled)';
                meta.classList.add('truncated');
                meta.title = 'Result set exceeded 10,000 points; even-sampled to fit.';
            }
        }
    }
}
</script>

</body>
</html>
