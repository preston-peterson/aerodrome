// Keep this inline and synchronous at the TOP of <head>. Moving it to a
// deferred module or the body would reintroduce the dark-flash on first
// load for users with light-mode saved.
(function(){
    try {
        var saved = localStorage.getItem('aerodrome-theme') || 'auto';
        var applied = saved;
        if (saved === 'auto') {
            applied = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', applied);
    } catch (e) { /* localStorage blocked? default-dark is fine */ }

<script>
// =============================================================================
// Minimal markdown → HTML renderer
// =============================================================================
// Purpose: render the subset of markdown used in Aerodrome's project docs
// (README, CHANGELOG, CONTRIBUTING, LICENSE, etc.) without a CDN dependency
// or a Python library. Handles:
//   - ATX headers (# through ######)
//   - Fenced code blocks (``` language)
//   - Inline code (`)
//   - Bold (**) and italic (*)
//   - Links [text](url) and images ![alt](url)
//   - Unordered lists (- or *)
//   - Ordered lists (1.)
//   - Blockquotes (>)
//   - Horizontal rules (---)
//   - Tables (GFM-style with |)
//   - Task list items (- [ ] and - [x])
//   - Paragraphs (blank-line-separated)
//
// Intentionally does NOT handle: reference-style links, HTML passthrough
// (except for escaping), autolinks without <>, footnotes, or other exotica.
// These docs don't use those features.
//
// Known limitations (by design — fix if they ever bite us):
//   - Nested lists (a bulleted list inside a numbered list, or vice versa)
//     are not supported. collectListItems flattens continuation lines with
//     ' ' joins and strips leading whitespace, so a nested marker would be
//     absorbed into the parent item's body.
//   - Multi-paragraph list items are flattened: consecutive continuation
//     lines become one run-on paragraph with spaces between what were
//     originally paragraph breaks. The blank-line separator between
//     paragraphs inside a list item isn't preserved.
//   - Indented fenced code blocks inside a list item render correctly ONLY
//     when preceded by a blank line (the common case — see UPDATE_README.md
//     and CONTRIBUTING.md). A fence tucked directly under a list marker
//     with no blank line will render as a plain fence in the main loop
//     (i.e. outside the list item) because the continuation loop now
//     terminates on an indented fence opener. Visually fine for the cases
//     we have, but technically not what CommonMark would do.
//   - Setext headers (underlined with === or ---) are not recognized; only
//     ATX (leading #) headers work.
//   - Lazy continuation inside blockquotes isn't supported; every line of
//     a blockquote must start with >.
//
// If we ever need full CommonMark, swap this out for a real library rather
// than incrementally hardening this file.

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Inline formatting: applied to a single line of text after block parsing.
// Order matters — process code spans first so their contents aren't mangled
// by later rules.
function renderInline(text) {
    // Escape HTML first so raw < and > are safe
    text = escapeHtml(text);

    // Inline code: `...` — placeholder it out so later rules don't touch it
    const codeSpans = [];
    text = text.replace(/`([^`]+)`/g, (m, code) => {
        codeSpans.push(code);
        return `\x00CODE${codeSpans.length - 1}\x00`;
    });

    // Images: ![alt](url)
    text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, url) => {
        return `<img src="${url}" alt="${alt}">`;
    });

    // Links: [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, txt, url) => {
        const isExternal = /^https?:/.test(url);
        const target = isExternal ? ' target="_blank" rel="noopener"' : '';
        return `<a href="${url}"${target}>${txt}</a>`;
    });

    // Bold: **text** (before italic so ** doesn't get eaten by * first)
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    // Italic: *text* (but not **)
    text = text.replace(/(?<!\*)\*(?!\*)([^*\n]+?)\*(?!\*)/g, '<em>$1</em>');

    // Task list markers: - [ ] or - [x] — only at the very start of an <li>
    // body, which after list extraction is just the start of the string.
    text = text.replace(/^\[ \] /, '<input type="checkbox" disabled> ');
    text = text.replace(/^\[x\] /i, '<input type="checkbox" checked disabled> ');

    // Restore code spans
    text = text.replace(/\x00CODE(\d+)\x00/g, (m, i) => {
        return `<code>${escapeHtml(codeSpans[parseInt(i, 10)])}</code>`;
    });

    return text;
}

// v2.41.21: per-document counter for duplicate heading slugs. Cleared at the
// start of every top-level renderMarkdown call so two separate documents
// (e.g. switching tabs) don't bleed into each other. Recursive renderMarkdown
// calls (blockquotes) intentionally share the counter so a heading inside a
// blockquote still gets a unique id relative to the outer document.
let _seenSlugs = Object.create(null);

// Slugify a heading string to a URL-safe id. Matches GitHub's rules closely
// enough for all existing Aerodrome docs. The main steps are:
//   1. Strip inline markdown formatting (backticks, emphasis, link syntax)
//      so `## \`live_aircraft\` query` slugifies the same as `live_aircraft
//      query`.
//   2. Lowercase.
//   3. Replace any non-alphanumeric run with a single hyphen.
//   4. Trim hyphens from both ends.
//   5. De-duplicate via -1, -2, ... suffixes tracked in _seenSlugs.
function headingSlug(raw) {
    // Strip markdown formatting tokens. Order matters: code first so its
    // contents survive, then link syntax, then emphasis markers.
    //
    // Underscore is deliberately NOT in the strip list, even though it can
    // mark emphasis in markdown. GitHub's slugger preserves underscores
    // because identifier-style headings (e.g. "## `snake_case_name`") are
    // common in technical docs, and stripping them breaks the resulting
    // slugs. A leading or trailing _ that's genuinely emphasis ("## _todo_")
    // will get caught by the non-word-char strip later anyway.
    let t = raw;
    t = t.replace(/`([^`]+)`/g, '$1');      // inline code
    t = t.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1'); // [text](url) -> text
    t = t.replace(/[*~]+/g, '');            // emphasis / strikethrough markers
    // Normalise: lowercase, strip everything that isn't alphanumeric / hyphen
    // / underscore / whitespace, collapse whitespace to hyphen, trim hyphens.
    let slug = t.toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    if (!slug) slug = 'section';  // edge case: heading that slugs to nothing
    // De-duplicate
    const count = _seenSlugs[slug] || 0;
    _seenSlugs[slug] = count + 1;
    return count === 0 ? slug : `${slug}-${count}`;
}

// Parse a full markdown document into HTML by walking it line-by-line.
// Block-level constructs accumulate until a terminator line closes them.
function renderMarkdown(md, opts) {
    // v2.41.21: top-level call resets the heading-slug counter. Recursive
    // calls (e.g. rendering a blockquote's contents) opt out by passing
    // {nested: true} so they inherit the outer document's counter.
    opts = opts || {};
    if (!opts.nested) {
        _seenSlugs = Object.create(null);
    }
    // Normalize line endings and strip a leading BOM if present
    md = md.replace(/\r\n/g, '\n').replace(/^\uFEFF/, '');
    const lines = md.split('\n');
    const out = [];

    let i = 0;
    while (i < lines.length) {
        const line = lines[i];

        // --- Fenced code block ---
        // The leading-whitespace tolerance on both the opener and closer
        // handles fences that live inside a list item (after the blank
        // line that ends the item's continuation loop, the fence lands
        // back in the main loop still carrying its 3-space indent). We
        // strip the opener's indent from each interior line so tree
        // diagrams and code samples don't render with stray leading
        // spaces in the <pre>.
        const fence = line.match(/^(\s*)```(\w*)\s*$/);
        if (fence) {
            const indent = fence[1];
            const lang = fence[2] || '';
            const stripRe = indent ? new RegExp('^' + indent) : null;
            const buf = [];
            i++;
            while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
                buf.push(stripRe ? lines[i].replace(stripRe, '') : lines[i]);
                i++;
            }
            i++;  // skip closing ```
            out.push(`<pre><code class="lang-${lang}">${escapeHtml(buf.join('\n'))}</code></pre>`);
            continue;
        }

        // --- Horizontal rule ---
        if (/^---+\s*$/.test(line) || /^\*\*\*+\s*$/.test(line)) {
            out.push('<hr>');
            i++;
            continue;
        }

        // --- ATX heading ---
        //
        // v2.41.21: emit an `id` attribute on each heading so in-document
        // table-of-contents links like [Install](#install) actually scroll
        // to the target. Previously we emitted bare <h2>Install</h2> which
        // made every anchor link a no-op.
        //
        // Slugification rules match GitHub's:
        //   - strip inline markdown (backticks, emphasis, link syntax)
        //   - lowercase
        //   - replace non-alphanumeric runs with single hyphens
        //   - trim leading/trailing hyphens
        //   - de-duplicate with -1, -2 suffixes within the same document
        //     (seenSlugs is scoped at the outer function level so that
        //     recursive calls for blockquotes share the counter)
        const head = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
        if (head) {
            const level = head[1].length;
            const rawText = head[2];
            const slug = headingSlug(rawText);
            out.push(`<h${level} id="${slug}">${renderInline(rawText)}</h${level}>`);
            i++;
            continue;
        }

        // --- Blockquote (consecutive "> " lines, may contain nested blocks) ---
        if (/^>\s?/.test(line)) {
            const qbuf = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
                qbuf.push(lines[i].replace(/^>\s?/, ''));
                i++;
            }
            // Recursively render inner content so it can contain paragraphs etc.
            out.push(`<blockquote>${renderMarkdown(qbuf.join('\n'))}</blockquote>`);
            continue;
        }

        // --- Table (GFM: header | separator | body rows) ---
        if (/^\s*\|/.test(line) && i + 1 < lines.length
                && /^\s*\|?[\s:|-]+\|[\s:|-]+/.test(lines[i + 1])) {
            const headerCells = line.split('|').slice(1, -1).map(c => c.trim());
            i += 2;  // skip header + separator
            const rows = [];
            while (i < lines.length && /^\s*\|/.test(lines[i])) {
                rows.push(lines[i].split('|').slice(1, -1).map(c => c.trim()));
                i++;
            }
            let tbl = '<table><thead><tr>';
            for (const h of headerCells) tbl += `<th>${renderInline(h)}</th>`;
            tbl += '</tr></thead><tbody>';
            for (const r of rows) {
                tbl += '<tr>';
                for (const c of r) tbl += `<td>${renderInline(c)}</td>`;
                tbl += '</tr>';
            }
            tbl += '</tbody></table>';
            out.push(tbl);
            continue;
        }

        // --- Unordered list ---
        if (/^[-*+]\s+/.test(line)) {
            const items = collectListItems(lines, i, /^[-*+]\s+/);
            i = items.nextIdx;
            out.push(`<ul>${items.html}</ul>`);
            continue;
        }

        // --- Ordered list ---
        if (/^\d+\.\s+/.test(line)) {
            const items = collectListItems(lines, i, /^\d+\.\s+/);
            i = items.nextIdx;
            out.push(`<ol>${items.html}</ol>`);
            continue;
        }

        // --- Blank line: paragraph separator ---
        if (line.trim() === '') {
            i++;
            continue;
        }

        // --- Paragraph ---
        // Consume consecutive non-empty non-special lines
        const pbuf = [line];
        i++;
        while (i < lines.length && lines[i].trim() !== '' &&
               !/^#{1,6}\s/.test(lines[i]) &&
               !/^\s*```/.test(lines[i]) &&
               !/^>\s?/.test(lines[i]) &&
               !/^[-*+]\s+/.test(lines[i]) &&
               !/^\d+\.\s+/.test(lines[i]) &&
               !/^---+\s*$/.test(lines[i]) &&
               !/^\s*\|/.test(lines[i])) {
            pbuf.push(lines[i]);
            i++;
        }
        out.push(`<p>${renderInline(pbuf.join(' '))}</p>`);
    }

    return out.join('\n');
}

// Collect consecutive list items matching a marker regex. Each item's body
// spans from its marker until the next marker or a blank-line-terminated
// paragraph. Returns rendered <li>...</li> HTML and the next index to process.
function collectListItems(lines, startIdx, markerRe) {
    let i = startIdx;
    const items = [];
    while (i < lines.length && markerRe.test(lines[i])) {
        const body = [lines[i].replace(markerRe, '')];
        i++;
        // Continuation lines of this list item: indented, or plain continuation
        // until a blank line or the next list marker. An indented fence opener
        // (e.g. a code block tucked directly under the list item with no
        // preceding blank line) terminates the continuation so the main loop
        // can render the fence block properly.
        while (i < lines.length && lines[i].trim() !== '' && !markerRe.test(lines[i])
               && !/^#{1,6}\s/.test(lines[i]) && !/^\s*```/.test(lines[i])) {
            body.push(lines[i].replace(/^\s+/, ''));
            i++;
        }
        // Skip the blank line between items, but don't consume it if it
        // precedes a non-list block (so the caller can handle that correctly).
        if (i < lines.length && lines[i].trim() === ''
                && i + 1 < lines.length && markerRe.test(lines[i + 1])) {
            i++;
        }
        items.push(body.join(' '));
    }
    const html = items.map(t => `<li>${renderInline(t)}</li>`).join('');
    return { html, nextIdx: i };
}

// =============================================================================
// Tab management + doc loading
// =============================================================================
// Which docs to list, what to label them, and where to fetch from. The server
// exposes /api/docs/<slug> which returns raw markdown text.
const DOCS = [
    { slug: 'readme',          label: 'README'       },
    { slug: 'install',         label: 'Install'      },
    { slug: 'changelog',       label: 'Changelog'    },
    { slug: 'performance',     label: 'Performance'  },
    { slug: 'search_syntax',   label: 'Search'       },
    { slug: 'contributing',    label: 'Contributing' },
    { slug: 'scripts_readme',  label: 'Scripts'      },
    { slug: 'update_readme',   label: 'Updates'      },
    { slug: 'license',         label: 'License'      },
];

let activeSlug = null;

function buildTabs() {
    const tabs = document.getElementById('docTabs');
    tabs.innerHTML = DOCS.map(d =>
        `<div class="tab" data-slug="${d.slug}">${d.label}</div>`
    ).join('');
    tabs.querySelectorAll('.tab').forEach(el => {
        el.addEventListener('click', () => showTab(el.dataset.slug));
    });
    // v2.41.32: attach scroll-arrow behaviour to the .tabs-wrap container
    // that holds these tabs. wireTabBarArrows is idempotent — safe to
    // call once here after tabs are populated.
    wireTabBarArrows(tabs.closest('.tabs-wrap'));
}

async function showTab(slug) {
    activeSlug = slug;
    document.querySelectorAll('.tab').forEach(el => {
        el.classList.toggle('on', el.dataset.slug === slug);
    });
    const container = document.getElementById('docContent');
    container.innerHTML = '<div class="doc-loading">Loading…</div>';
    try {
        const r = await fetch(`/api/docs/${slug}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const md = await r.text();
        let html = renderMarkdown(md);
        // README image paths reference docs/screenshot-*.png (relative paths
        // that GitHub resolves automatically). For our in-app viewer we need
        // them to point at the live-served files under /docs/.
        html = html.replace(/src="docs\//g, 'src="/docs/');
        container.innerHTML = `<div class="md-body">${html}</div>`;
        // Update URL hash so the user can bookmark a specific tab
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', `#${slug}`);
        }
        container.scrollTop = 0;
    } catch (e) {
        container.innerHTML = `<div class="doc-error">Could not load doc: ${e.message}</div>`;
    }
}

async function loadVersion() {
    try {
        const r = await fetch('/api/status');
        const j = await r.json();
        if (j.version) document.getElementById('appVersion').textContent = j.version;
    } catch (e) { /* ignore — version is cosmetic */ }
    // v2.85.12: shared formatter respects display.time_format.
    const tsEl = document.getElementById('ts');
    if(tsEl) tsEl.textContent = formatDateTime(new Date());
}

// v2.41.32: shared tab-bar scroll-arrow helpers. Same implementation as
// config.html. See config.html for the long-form comment explaining the
// behaviour. Duplicated here because docs.html is served as its own
// self-contained template with its own script context.
function wireTabBarArrows(wrap){
    if(!wrap) return;
    const tabs  = wrap.querySelector('.tabs');
    const left  = wrap.querySelector('.tab-scroll-btn.left');
    const right = wrap.querySelector('.tab-scroll-btn.right');
    if(!tabs || !left || !right) return;
    if(wrap.dataset.arrowsWired === '1') {
        updateTabScrollArrows(wrap);
        return;
    }
    wrap.dataset.arrowsWired = '1';
    const SCROLL_STEP_RATIO = 0.6;
    left.addEventListener('click', () => {
        tabs.scrollBy({ left: -tabs.clientWidth * SCROLL_STEP_RATIO, behavior: 'smooth' });
    });
    right.addEventListener('click', () => {
        tabs.scrollBy({ left: tabs.clientWidth * SCROLL_STEP_RATIO, behavior: 'smooth' });
    });
    tabs.addEventListener('scroll', () => updateTabScrollArrows(wrap));
    window.addEventListener('resize', () => updateTabScrollArrows(wrap));
    requestAnimationFrame(() => updateTabScrollArrows(wrap));
}

function updateTabScrollArrows(wrap){
    const tabs  = wrap.querySelector('.tabs');
    const left  = wrap.querySelector('.tab-scroll-btn.left');
    const right = wrap.querySelector('.tab-scroll-btn.right');
    if(!tabs || !left || !right) return;
    const maxScroll = tabs.scrollWidth - tabs.clientWidth;
    const atStart = tabs.scrollLeft <= 2;
    const atEnd   = tabs.scrollLeft >= maxScroll - 2;
    const hasOverflow = maxScroll > 0;
    left.classList.toggle('show',  hasOverflow && !atStart);
    right.classList.toggle('show', hasOverflow && !atEnd);
}

document.addEventListener('DOMContentLoaded', () => {
    buildTabs();
    loadVersion();
    // Respect #slug hash if the user navigated here with one, otherwise default
    const initial = (window.location.hash || '').replace(/^#/, '') || DOCS[0].slug;
    const match = DOCS.find(d => d.slug === initial) ? initial : DOCS[0].slug;
    showTab(match);
});

// Gear menu — same behavior as status/config/updates
function toggleMenu(e) {
    e.stopPropagation();
    document.getElementById('settingsMenu').classList.toggle('open');
}
document.addEventListener('click', e => {
    if (!e.target.closest('.settings-wrap')) {
        document.getElementById('settingsMenu').classList.remove('open');
    }
});


</script>
